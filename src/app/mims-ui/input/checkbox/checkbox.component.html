<clr-checkbox-container>
  <clr-checkbox-wrapper>
    <input
      type="checkbox"
      clrCheckbox
      [(ngModel)]="value"
      [id]="checkboxId"
      (change)="changeCheckOption()"
    />
    <label [for]="checkboxId" class="visually-hidden">
      {{ checkboxLabel || label }}
    </label>
  </clr-checkbox-wrapper>
</clr-checkbox-container>
