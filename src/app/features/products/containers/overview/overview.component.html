<mims-header [title]="'Overview'" [subTitle]="'Crankshaft'" [color]="'#5965e7'">
  <div class="col-lg-2">
    <mims-button-outline
      [buttontype]="'info'"
      [value]="'SCHEDULING'"
    ></mims-button-outline>
  </div>
</mims-header>

<div class="row">
  <div class="col-lg-12">
    <div class="row">
      <div class="col-lg-4" *ngFor="let card of cardsData">
        <mims-card
          [title]="card.title"
          [titleColour]="card.titleColour"
          [text]="card.text"
          [textColour]="card.textColour"
          [topRightTitle]="card.topRightTitle"
          [topRightTitleColor]="card.topRightTitleColor"
          [midRightTitle]="card.midRightTitle"
          [midRightTitleColor]="card.midRightTitleColor"
          [backgroundColour]="card.backgroundColour"
          [buttonText]="card.buttonText"
        ></mims-card>
      </div>
    </div>

    <div class="row flex-items-xs-middle">
      <div class="col-xl-4 col-lg-12 col-md-12">
        <ng-container *ngIf="chartData() as chartData">
          <mims-vertical-bar-chart [data]="chartData"></mims-vertical-bar-chart>
        </ng-container>
      </div>
      <div class="col-xl-8 col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="row">
          <div
            class="col-lg-3 col-md-6 col-sm-12 col-xs-12"
            *ngFor="let gauge of gaugeData"
          >
            <mims-gauge-chart [gaugeData]="gauge"></mims-gauge-chart>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <ng-container *ngIf="headerNames() as headerNames">
      <ng-container *ngIf="columnNames() as columnNames">
        <ng-container *ngIf="tableData() as rowData">
          <mims-data-grid
            [headerName]="headerNames"
            [pageSize]="5"
            [columName]="columnNames"
            [rowData]="rowData"
          ></mims-data-grid>
        </ng-container>
      </ng-container>
    </ng-container>
  </div>
</div>
