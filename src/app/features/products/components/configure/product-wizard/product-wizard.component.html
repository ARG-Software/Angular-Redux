<ng-container *ngIf="errors.length > 0">
  <mims-alert [isSmall]="true" [type]="dangerType">
    <div *ngFor="let error of errors">
      {{ error }}
    </div>
  </mims-alert>
</ng-container>
<section class="form-block">
  <form [formGroup]="productsForm">
    <div class="form-group">
      <label for="product-details-name">Name</label>
      <mims-input
        [id]="'product-details-name'"
        value="{{ productDetailsData.Name }}"
        [formControlName]="'Name'"
      ></mims-input>
    </div>
    <div class="form-group">
      <label for="target-hours-per-week">Target Hours Per Week</label>
      <mims-input
        [id]="'target-hours-per-week'"
        value="{{ productDetailsData.TargetHoursPerWeek }}"
        [formControlName]="'TargetHoursPerWeek'"
      ></mims-input>
    </div>
    <div class="form-group">
      <label for="target-efficiency">Target Efficiency</label>
      <mims-input
        [id]="'target-efficiency'"
        value="{{ productDetailsData.TargetEfficiency }}"
        [formControlName]="'TargetEfficiency'"
      ></mims-input>
    </div>
    <mims-button-outline
      [buttontype]="'success'"
      value="Save Product"
      (click)="onSaveProduct()"
    ></mims-button-outline>
  </form>
</section>
