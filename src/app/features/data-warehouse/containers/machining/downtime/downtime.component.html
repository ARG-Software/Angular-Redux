<mims-header
  [title]="'Pareto Chart'"
  [subTitle]="'Downtime'"
  [color]="'#5965e7'"
>
  <downtime-filter-box
    *ngIf="productSelectBoxData$ | async as productSelectBoxData"
    [productSelectBoxData]="productSelectBoxData"
    [machineSelectBoxData]="(machineSelectBoxData$ | async) || []"
    [defaultFilters]="request.Filters"
    (OnFilterApply)="filtersOptions($event)"
  >
  </downtime-filter-box>
</mims-header>

<ng-container *ngIf="chartData$ | async as chartData">
  <ng-container *ngIf="tableData$ | async as tableData">
    <ng-container *ngIf="tablePaging$ | async as paginationDetails">
      <downtime-information
        [chartData]="chartData"
        [tableData]="tableData"
        [chartColors]="chartColors"
        [chartSize]="chartSize"
        [paginationDetails]="paginationDetails"
        (changePage)="requestNewPage($event)"
      >
      </downtime-information>
    </ng-container>
  </ng-container>
</ng-container>
