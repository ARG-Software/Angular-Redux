<mims-header
  [title]="header.HeaderTitle"
  [subTitle]="header.HeaderSubTitle"
  [color]="header.Color"
>
</mims-header>

<p *ngIf="loading()">Loading...</p>

<machine-state-information
  *ngIf="!loading() && machineData() as machineData"
  [machineData]="machineData"
  (changedMachineEmitter)="saveMachine($event)"
>
</machine-state-information>
